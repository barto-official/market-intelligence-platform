# Bumps version, updates CHANGELOG, commits, and tags on main — only after CI succeeds.
# Uses a GitHub App token so tag pushes trigger release.yaml and cd_docs.yml.
#
# Required repository configuration:
#   vars.MIP_RELEASE_APP_ID          — GitHub App ID
#   secrets.MIP_RELEASE_APP_PRIVATE_KEY — GitHub App private key (PEM)
#
# The App needs Contents: Read and write on this repository.

name: Version Bump & Changelog

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bump-version:
    if: |
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push' &&
        !startsWith(github.event.workflow_run.head_commit.message, 'bump:')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Create token from GitHub App
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.MIP_RELEASE_APP_ID }}
          private-key: ${{ secrets.MIP_RELEASE_APP_PRIVATE_KEY }}

      - name: Check out
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}

      - name: Bump and changelog (after CI on main)
        if: github.event_name == 'workflow_run'
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Dry-run bump and changelog (pull request)
        if: github.event_name == 'pull_request'
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          dry_run: true
          push: false
